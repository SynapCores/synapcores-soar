# Build and publish the app image to GHCR.
#
# Neither this repo nor its siblings had any CI, which is the only reason a
# ready-to-run image was never published -- the packaging was never the hard
# part. Manual publishing is why it kept not happening.
name: publish-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: derived from ref)'
        required: false

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is the registry most people reach for first, so the image is
      # published to BOTH. Same digest, two names.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/synapcores/soar
            docker.io/synapcores/soar
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/soar/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Hub listing page renders its own README, separate from the repo's.
      # Without this step it stays empty and the image looks abandoned.
      # Best-effort: editing a Hub repo description needs a token with admin
      # scope on the repo, while pushing images only needs read/write. With a
      # push-scoped token this returns 403 "insufficient scope". That must not
      # fail an otherwise-good release, so the step is advisory until the token
      # is upgraded in Docker Hub -> Account Settings -> Personal access tokens.
      - name: Sync the Docker Hub description (best effort)
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: synapcores/soar
          readme-filepath: apps/soar/DOCKERHUB.md
          short-description: ${{ github.event.repository.description }}

      - name: Smoke-test BOTH published registries
        run: |
          # Verify every tag we claimed to push is actually pullable. Pushing
          # to two registries and only checking one is how a half-published
          # release goes unnoticed.
          echo "${{ steps.meta.outputs.tags }}" | while read -r IMAGE; do
            [ -n "$IMAGE" ] || continue
            echo "--- $IMAGE"
            docker pull "$IMAGE" >/dev/null
            docker run --rm --entrypoint node "$IMAGE" --version
          done
          echo "all published tags pull and run"
