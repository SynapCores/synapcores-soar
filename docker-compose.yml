version: '3.9'

# ─────────────────────────────────────────────────────────────────────────
# SynapCores apps — full stack (engine + SOAR + AML)
#
# Quickstart:
#   1. cp .env.example .env
#   2. docker compose up -d synapcores
#   3. Get the admin password:  docker compose logs synapcores | grep "password:"
#   4. Log into engine UI at :28080, mint admin API token, paste into .env
#   5. docker compose up -d
#   6. SOAR at http://localhost:3001/register
#      AML  at http://localhost:3003/register
#
# Both apps share the same SynapCores engine but live in separate tenants —
# pick which one(s) to expose by commenting services out.
# ─────────────────────────────────────────────────────────────────────────

services:
  synapcores:
    image: synapcores/community:${SYNAPCORES_TAG:-v1.14.5-ce}
    # A floating tag only re-resolves on an explicit pull; without this a host
    # keeps whatever it first cached. Pin via SYNAPCORES_TAG to freeze it.
    pull_policy: missing
    container_name: synapcores-engine
    environment:
      AIDB_ACCEPT_LICENSE: '1'
      AIDB_JWT_SECRET: ${AIDB_JWT_SECRET:?Set AIDB_JWT_SECRET in .env}
      # Pinning the admin password lets each app exchange it for a token at
      # startup, so a first run is `docker compose up -d` with no manual
      # log-grepping for the first-boot key.
      AIDB_ADMIN_PASSWORD: ${AIDB_ADMIN_PASSWORD:?Set AIDB_ADMIN_PASSWORD in .env}
    ports:
      - '28080:8080'
    volumes:
      - sc-engine-data:/var/lib/synapcores
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  soar:
    # Published image by default; `docker compose build soar` builds from source.
    image: ${SOAR_APP_IMAGE:-ghcr.io/synapcores/soar:latest}
    build:
      context: .
      dockerfile: apps/soar/Dockerfile
    container_name: synapcores-soar-app
    depends_on:
      synapcores:
        condition: service_healthy
    environment:
      SYNAPCORES_URL: http://synapcores:8080
      # Optional. Leave empty and the entrypoint mints a token from
      # AIDB_ADMIN_PASSWORD; set it to hand the app a narrower key instead.
      SYNAPCORES_ADMIN_API_KEY: ${SYNAPCORES_ADMIN_API_KEY:-}
      AIDB_ADMIN_PASSWORD: ${AIDB_ADMIN_PASSWORD:?Set AIDB_ADMIN_PASSWORD in .env}
      FRAMEWORK_TENANT_KEYS_DIR: /var/synapcores/tenant-keys
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NEXTAUTH_URL: ${SOAR_NEXTAUTH_URL:-http://localhost:3001}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      SOAR_TRIAGE_MODE: ${SOAR_TRIAGE_MODE:-auto}
    ports:
      - '3001:3001'
    # No command override: the image entrypoint waits for the engine, applies
    # both schemas, then runs the Next.js PRODUCTION server. The old inline
    # command installed dependencies at every start and served `next dev`.
    restart: unless-stopped

  aml:
    image: node:22-alpine
    container_name: synapcores-aml-app
    depends_on:
      synapcores:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app
      - sc-aml-app-cache:/app/.next
    environment:
      SYNAPCORES_URL: http://synapcores:8080
      # Optional here too: a `:?` guard is evaluated when compose parses the
      # WHOLE file, so leaving it on this service would break `up -d soar`
      # for anyone who never configures AML.
      SYNAPCORES_ADMIN_API_KEY: ${SYNAPCORES_ADMIN_API_KEY:-}
      AIDB_ADMIN_PASSWORD: ${AIDB_ADMIN_PASSWORD:?Set AIDB_ADMIN_PASSWORD in .env}
      FRAMEWORK_TENANT_KEYS_DIR: /var/synapcores/tenant-keys
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NEXTAUTH_URL: ${AML_NEXTAUTH_URL:-http://localhost:3003}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      AML_TRIAGE_MODE: ${AML_TRIAGE_MODE:-auto}
      AML_DEFAULT_JURISDICTION: ${AML_DEFAULT_JURISDICTION:-us-fincen}
    ports:
      - '3003:3003'
    command: >
      sh -c "
        corepack enable && corepack prepare pnpm@9 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm framework:bootstrap &&
        pnpm aml:bootstrap &&
        pnpm aml:dev
      "
    restart: unless-stopped

volumes:
  sc-engine-data:
  sc-soar-app-cache:
  sc-aml-app-cache:
