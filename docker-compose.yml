# ─────────────────────────────────────────────────────────────────────────
# SynapCores SOAR — single-host stack
#
# Quickstart:
#   1. cp .env.example .env  (and set AIDB_JWT_SECRET + AUTH_SECRET to 32 random bytes)
#   2. docker compose up -d synapcores
#   3. Get the admin password:  docker compose logs synapcores | grep "password:"
#   4. Log into engine UI at :28080, mint an admin API token, paste into .env
#      as SYNAPCORES_ADMIN_API_KEY.
#   5. docker compose up -d soar
#   6. SOAR at http://localhost:3001/register
#
# Sibling AML app is in its own repo:
#   https://github.com/SynapCores/synapcores-aml
# ─────────────────────────────────────────────────────────────────────────

services:
  synapcores:
    image: synapcores/community:latest
    container_name: synapcores-engine
    environment:
      AIDB_ACCEPT_LICENSE: '1'
      AIDB_JWT_SECRET: ${AIDB_JWT_SECRET:?Set AIDB_JWT_SECRET in .env}
    ports:
      - '28080:8080'
    volumes:
      - sc-engine-data:/var/lib/synapcores
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  soar:
    image: node:22-alpine
    container_name: synapcores-soar-app
    depends_on:
      synapcores:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app
      - sc-soar-app-cache:/app/.next
    environment:
      SYNAPCORES_URL: http://synapcores:8080
      SYNAPCORES_ADMIN_API_KEY: ${SYNAPCORES_ADMIN_API_KEY:?Set SYNAPCORES_ADMIN_API_KEY in .env (mint at http://localhost:28080 after the engine boots)}
      FRAMEWORK_TENANT_KEYS_DIR: /var/synapcores/tenant-keys
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NEXTAUTH_URL: ${SOAR_NEXTAUTH_URL:-http://localhost:3001}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-console}
      SOAR_TRIAGE_MODE: ${SOAR_TRIAGE_MODE:-auto}
    ports:
      - '3001:3001'
    command: >
      sh -c "
        corepack enable && corepack prepare pnpm@9 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm framework:bootstrap &&
        pnpm soar:bootstrap &&
        pnpm soar:dev
      "
    restart: unless-stopped

volumes:
  sc-engine-data:
  sc-soar-app-cache:
